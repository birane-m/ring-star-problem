[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-star"
version = "0.2.0"
description = "Ring-Star optimization, reproducible experiments and visual comparisons"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4", "pulp>=3.3,<4"]

[project.scripts]
ring-star = "ring_star.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
